Array.prototype.max=function(){
max=this[1];
len=this.length;
for(i=1;i<len;i++)if(this[i]>max)max=this[i];
return max;
}
Array.prototype.min=function(){
min=this[1];
len=this.length;
for(i=1;i<len;i++)if(this[i]<min)min=this[i];
return min;
}
Array.prototype.avg=function(){
av=0;
cnt=0;
len=this.length;
for(i=1;i<len;i++){
e=+this[i];
if(!e && this[i] !== 0 && this[i] !== '0') e--;
if(this[i]==e){av+=e;cnt++;}
}
return av/cnt;
}
