services:
  go-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - go-api
    ports:
      - "10.10.99.119:1200-1250:1200-1250"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

networks:
  backend:
    driver: bridge
